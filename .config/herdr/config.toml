onboarding = false
[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
pane_borders = true
pane_gaps = true
right_click_passthrough_modifier = "ctrl"
mobile_width_threshold = 64
show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["agent"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["workspace", "state_icon"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[terminal]
new_cwd = "follow"

[theme]
name = "dracula"
auto_switch = false

[worktrees]
directory = "~/.herdr/worktrees"

[keys]
prefix = "ctrl+space"
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = ""
split_vertical = "prefix+^"
focus_pane_left = "alt+h"
focus_pane_down = "alt+j"
focus_pane_up = "alt+k"
focus_pane_right = "alt+l"
previous_tab = "alt+shift+h"
next_tab = "alt+shift+l"
# cycle_pane_previous = "ctrl+tab"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "lazygit"
description = "open lazygit"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+b"
type = "popup"
command = "exec \"${SHELL:-sh}\""
description = "open terminal"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = "code ."
description = "open vscode in the current directory"

[[keys.command]]
key = "prefix+shift+e"
type = "shell"
command = "explorer.exe ."
description = "open explorer in the current directory"

[[keys.command]]
key = "prefix+<"
type = "popup"
command = "exec nvim ~/.config/herdr/config.toml"
width = "80%"
height = "80%"

[[keys.command]]
key = "alt+u"
type = "plugin_action"
command = "jugyo.nav-history.back"

[[keys.command]]
key = "alt+r"
type = "plugin_action"
command = "jugyo.nav-history.forward"


# [[keys.command]]              # open in a split beside your work
# key = "prefix+f"
# type = "shell"
# command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

# [[keys.command]]              # …or in its own tab
# key = "prefix+shift+f"
# type = "shell"
# command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = false
kitty_graphics = true

[session]
resume_agents_on_restore = true 

[update]
channel = "stable"
version_check = true
manifest_check = true
