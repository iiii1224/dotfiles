[settings]
# Only takes effect for project configs (a mise.lock next to a mise.toml); mise
# writes no lockfile for this global config. Reproducibility here comes from the
# exact version pins below, which ./update.sh --bump rewrites.
lockfile = true
minimum_release_age = "7d"
node.corepack = true

[tools]
rust = "1.97.1"
go = "1.26.5"
node = "24.18.0"
"npm:pyright" = "1.1.411"
marksman = "2026-02-08"
rust-analyzer = "2026-08-03"
github-cli = "2.96.0"
uv = "0.11.32"
bat = "0.26.1"
bottom = "0.14.6"
fzf = "0.74.1"
glow = "2.1.2"
herdr = "0.9.0"
ripgrep = "15.2.0"
tmux = "3.7b"
yazi = "26.5.6"
zoxide = "0.10.0"
tlrc = "1.13.1"
lazygit = "0.63.1"
neovim = "0.12.4"
"cargo:broot" = "1.58.0"
